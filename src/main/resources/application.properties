spring.application.name=PaymentService
server.port=${PAYMENT_SERVER_PORT:8084}
spring.datasource.url=${PAYMENT_DB_URL:jdbc:mysql://localhost:3309/payment_service}
spring.datasource.username=${PAYMENT_DB_USERNAME:payment_user}
spring.datasource.password=${PAYMENT_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
security.jwt.issuer=${AUTH_ISSUER_URI:http://localhost:8081}
security.jwt.jwk-set-uri=${AUTH_JWK_SET_URI:http://localhost:8081/oauth2/jwks}
security.jwt.audience=${AUTH_AUDIENCE:platform-api}
services.order.base-url=${ORDER_SERVICE_URL:http://localhost:8083}
payments.stripe.enabled=${STRIPE_ENABLED:true}
payments.stripe.api-key=${STRIPE_API_KEY}
payments.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
payments.stripe.success-url=${PAYMENT_SUCCESS_URL:http://localhost:3000/payments/success?session_id={CHECKOUT_SESSION_ID}}
payments.stripe.cancel-url=${PAYMENT_CANCEL_URL:http://localhost:3000/payments/cancelled}

